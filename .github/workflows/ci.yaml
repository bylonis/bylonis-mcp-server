name: ci

# gofmt, vet, tests and build on every pull request to bylonis-main and on
# every push to it. Pull requests from forks get no secrets (plain
# pull_request event), so nothing here needs them.
on:
  pull_request:
    branches: [bylonis-main]
  push:
    branches: [bylonis-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -o /dev/null ./cmd/server

      # The embedded ClickHouse schema must match the collector migrations it is
      # generated from (tools/genschema, a separate module: it links the AGPL
      # collector, the server binary does not).
      - name: clickhouse schema up to date
        working-directory: tools/genschema
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet .
          go run . ../../pkg/dashboard/schema
          git diff --exit-code -- ../../pkg/dashboard/schema
