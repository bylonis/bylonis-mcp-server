services:
  bylonis-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bylonis-mcp-server
    ports:
      - "${MCP_SERVER_PORT:-8000}:8000"
    environment:
      - BYLONIS_URL=${BYLONIS_URL}
      - BYLONIS_API_KEY=${BYLONIS_API_KEY}
      - TRANSPORT_MODE=http
      - MCP_SERVER_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    networks:
      - bylonis-mcp-network
    labels:
      - "ai.bylonis.service=bylonis-mcp-server"
      - "ai.bylonis.description=ByLonis MCP Server for AI assistants"

networks:
  bylonis-mcp-network:
    driver: bridge
